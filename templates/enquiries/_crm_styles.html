<style>
    /* CRM — built on ProFit theme tokens (light/dark aware).
       crm-stat, crm-tabs and chip-* base styles live in profit-theme.css */
    .crm-ring { height: 6px; border-radius: 3px; background: rgba(20,20,20,.15); margin-top: 10px; overflow: hidden; }
    .crm-ring > span { display: block; height: 100%; background: #141414; border-radius: 3px; }

    /* Follow-up alert strip */
    .crm-alert {
        display: flex; align-items: center; gap: 14px; height: 100%;
        background: var(--pf-surface); border: 1px solid var(--pf-border); border-radius: var(--pf-radius);
        padding: 14px 18px; color: var(--pf-text); box-shadow: var(--pf-shadow-sm); transition: all .2s ease;
    }
    .crm-alert:hover { border-color: var(--pf-gold-border); box-shadow: var(--pf-shadow-md); color: var(--pf-text); transform: translateY(-2px); }
    .crm-alert .ic { width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0; display: grid; place-items: center; font-size: 1.2rem; }
    .crm-alert .num { font-size: 1.4rem; font-weight: 800; line-height: 1; font-family: var(--pf-font-display); }
    .crm-alert .txt { font-size: .72rem; color: var(--pf-text-2); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .ic-red    { background: var(--pf-danger-soft);  color: var(--pf-danger); }
    .ic-orange { background: var(--pf-warning-soft); color: var(--pf-warning); }
    .ic-gold   { background: var(--pf-gold-soft);    color: var(--pf-accent-text); }
    .ic-dark   { background: var(--pf-ink); color: var(--pf-gold); border: 1px solid var(--pf-ink-border); }

    /* Action buttons */
    .crm-btn {
        display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px;
        font-weight: 700; font-size: .875rem; transition: all .2s ease; position: relative; white-space: nowrap;
    }
    .crm-btn-dark { background: var(--pf-surface); color: var(--pf-text); border: 1px solid var(--pf-border-strong); }
    .crm-btn-dark:hover { border-color: var(--pf-gold-border); color: var(--pf-text); transform: translateY(-1px); box-shadow: var(--pf-shadow-sm); }
    .crm-btn-dark i { color: var(--pf-accent-text); }
    .crm-btn-gold { background: var(--pf-gradient); color: #141414; border: 0; box-shadow: 0 4px 14px -6px rgba(255,140,0,.6); }
    .crm-btn-gold:hover { filter: brightness(1.05); color: #141414; transform: translateY(-1px); box-shadow: var(--pf-shadow-gold); }
    .crm-btn .count-pill { background: #EF4444; color: #fff; font-size: .68rem; font-weight: 700; border-radius: 10px; padding: 1px 7px; }

    /* Panels */
    .crm-panel {
        background: var(--pf-surface); border-radius: var(--pf-radius-lg); border: 1px solid var(--pf-border);
        overflow: hidden; height: 100%; display: flex; flex-direction: column; box-shadow: var(--pf-shadow-sm);
    }
    .crm-panel-head {
        padding: 14px 20px; font-weight: 700; font-size: .92rem; color: var(--pf-text);
        border-bottom: 1px solid var(--pf-border);
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .crm-panel-head i { color: var(--pf-accent-text); }
    .crm-panel-head a { color: var(--pf-accent-text); font-size: .78rem; font-weight: 600; }
    .crm-panel-head a:hover { color: var(--pf-orange); }
    .crm-panel-body { padding: 18px 20px; flex: 1; }
    .crm-panel .table td { vertical-align: middle; }

    .crm-avatar {
        width: 36px; height: 36px; border-radius: 50%; background: var(--pf-gold-soft); color: var(--pf-accent-text);
        display: inline-grid; place-items: center; font-weight: 700; font-size: .8rem; flex-shrink: 0; text-transform: uppercase;
        border: 1px solid var(--pf-gold-border);
    }
    .crm-name { font-weight: 600; color: var(--pf-text); }
    .crm-name:hover { color: var(--pf-accent-text); }
    .crm-meta { font-size: .76rem; color: var(--pf-text-2); }

    .chip { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: .7rem; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
    .chip-converted { background: var(--pf-gradient); color: #141414; }

    /* Breakdown bars */
    .bd-row { margin-bottom: 14px; }
    .bd-row:last-child { margin-bottom: 0; }
    .bd-top { display: flex; justify-content: space-between; font-size: .82rem; margin-bottom: 6px; }
    .bd-top .l { font-weight: 600; color: var(--pf-text); }
    .bd-top .r { color: var(--pf-text-2); font-weight: 600; }
    .bd-track { height: 8px; background: var(--pf-surface-3); border-radius: 4px; overflow: hidden; }
    .bd-fill { height: 100%; border-radius: 4px; background: var(--pf-gradient); }
    .bd-fill.dark { background: var(--pf-text); opacity: .75; }

    /* Activity timeline */
    .tl { list-style: none; padding: 0; margin: 0; }
    .tl li { position: relative; padding-left: 26px; padding-bottom: 16px; }
    .tl li:last-child { padding-bottom: 0; }
    .tl li::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: -4px; width: 2px; background: var(--pf-border); }
    .tl li:last-child::before { display: none; }
    .tl li::after { content: ''; position: absolute; left: 0; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--pf-surface); border: 3px solid var(--pf-orange); }
    .tl .tl-title { font-size: .875rem; font-weight: 600; }
    .tl .tl-desc { font-size: .8rem; color: var(--pf-text-2); margin-top: 2px; }

    .crm-empty { text-align: center; color: var(--pf-text-3); padding: 28px 10px; font-size: .875rem; }
    .crm-empty i { font-size: 1.8rem; display: block; margin-bottom: 6px; color: var(--pf-border-strong); }
    .chart-box { position: relative; height: 260px; }

    /* Lead cards (follow-ups) */
    .lead-card {
        background: var(--pf-surface); border: 1px solid var(--pf-border); border-radius: var(--pf-radius-lg);
        padding: 18px 18px 16px 22px; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden;
        box-shadow: var(--pf-shadow-sm); transition: all .2s ease;
    }
    .lead-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pf-gradient); }
    .lead-card.overdue::before { background: #EF4444; }
    .lead-card.upcoming::before { background: var(--pf-text-3); }
    .lead-card:hover { transform: translateY(-3px); box-shadow: var(--pf-shadow-md); border-color: var(--pf-gold-border); }
    .lead-card .lead-info { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; font-size: .82rem; color: var(--pf-text-2); }
    .lead-card .lead-info i { color: var(--pf-accent-text); width: 18px; display: inline-block; }
    .lead-card .lead-info a { color: var(--pf-text); font-weight: 600; }
    .lead-card .lead-foot { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--pf-border); display: flex; gap: 8px; align-items: center; }
    .btn-call { width: 38px; height: 38px; border-radius: 10px; display: inline-grid; place-items: center; background: var(--pf-success-soft); color: var(--pf-success); border: 0; flex-shrink: 0; }
    .btn-call:hover { background: #16A34A; color: #fff; }
    .btn-action-gold, .btn-action-dark, .btn-action-red { flex: 1; border: 0; border-radius: 10px; padding: 9px 12px; font-weight: 700; font-size: .8rem; text-align: center; transition: all .15s; }
    .btn-action-gold { background: var(--pf-gradient); color: #141414; }
    .btn-action-gold:hover { filter: brightness(1.05); color: #141414; }
    .btn-action-dark { background: var(--pf-surface-3); color: var(--pf-text); border: 1px solid var(--pf-border); }
    .btn-action-dark:hover { border-color: var(--pf-gold-border); color: var(--pf-text); }
    .btn-action-red { background: #DC2626; color: #fff; }
    .btn-action-red:hover { background: #B91C1C; color: #fff; }
    .crm-empty-lg { background: var(--pf-surface); border: 1px dashed var(--pf-border-strong); border-radius: var(--pf-radius-lg); padding: 48px 20px; text-align: center; color: var(--pf-text-2); }
    .crm-empty-lg i { font-size: 2.5rem; color: var(--pf-accent-text); display: block; margin-bottom: 10px; }
    .crm-empty-lg .t { font-size: 1.05rem; font-weight: 700; color: var(--pf-text); }

    /* Filter bar */
    .crm-filter { background: var(--pf-surface); border: 1px solid var(--pf-border); border-radius: var(--pf-radius-lg); padding: 16px 20px; box-shadow: var(--pf-shadow-sm); }
    .crm-filter .form-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--pf-text-2); margin-bottom: 4px; }
    .quick-filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .qf { font-size: .76rem; font-weight: 600; padding: 6px 13px; border-radius: 20px; background: var(--pf-surface-3); color: var(--pf-text-2); border: 1px solid transparent; transition: all .15s; }
    .qf:hover { border-color: var(--pf-gold-border); color: var(--pf-text); }
    .qf.active { background: var(--pf-ink); color: var(--pf-gold); }
    [data-bs-theme="dark"] .qf.active { background: var(--pf-gold); color: #141414; }

    /* Modal */
    .crm-modal .modal-content { border-radius: 18px; overflow: hidden; }
    .crm-modal .modal-header { background: var(--pf-ink); color: var(--pf-gold); border: 0; padding: 16px 22px; }
    .crm-modal .modal-header .btn-close { filter: invert(1) grayscale(1) brightness(2); }
    .crm-modal .modal-title { font-weight: 700; font-size: 1rem; color: var(--pf-gold); }
    .crm-modal .modal-title span { color: #fff; }
    .crm-modal .modal-body { padding: 22px; }
    .crm-modal .modal-footer { border: 0; padding: 0 22px 22px; }
    .crm-modal .form-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--pf-text-2); }
    .outcome-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .outcome-grid input { display: none; }
    .outcome-grid label { border: 1px solid var(--pf-border-strong); border-radius: 10px; padding: 10px 12px; font-size: .8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all .15s; margin: 0; color: var(--pf-text); }
    .outcome-grid label:hover { border-color: var(--pf-gold-border); background: var(--pf-surface-2); }
    .outcome-grid input:checked + label { background: var(--pf-ink); color: var(--pf-gold); border-color: var(--pf-ink); }
    [data-bs-theme="dark"] .outcome-grid input:checked + label { background: var(--pf-gold-soft); color: var(--pf-gold); border-color: var(--pf-gold-border); }
    .outcome-grid input#oc-converted:checked + label { background: var(--pf-gradient); color: #141414; border-color: transparent; }
    .outcome-hint { font-size: .78rem; color: var(--pf-text-2); margin-top: 8px; min-height: 18px; }

    .crm-panel .dataTables_wrapper { padding: 14px 20px 18px; }
    .icon-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; border: 1px solid var(--pf-border); background: var(--pf-surface); color: var(--pf-text); font-size: .875rem; transition: all .15s; }
    .icon-btn:hover { background: var(--pf-ink); color: var(--pf-gold); border-color: var(--pf-ink); }
    [data-bs-theme="dark"] .icon-btn:hover { background: var(--pf-gold); color: #141414; border-color: var(--pf-gold); }
    .icon-btn.call:hover { background: #16A34A; color: #fff; border-color: #16A34A; }
    .due-overdue { color: var(--pf-danger); font-weight: 700; }
    .due-today { color: var(--pf-warning); font-weight: 700; }

    @media (max-width: 575.98px) {
        .crm-btn { padding: 9px 14px; font-size: .82rem; }
        .outcome-grid { grid-template-columns: 1fr 1fr; }
    }
</style>
<style>
    /* Enquiry detail (lead-hero base lives in profit-theme.css) */
    .lead-hero { border-bottom: 3px solid var(--pf-gold); }
    .lead-hero .bg-icon { position: absolute; right: -14px; bottom: -24px; font-size: 130px; color: var(--pf-gold); opacity: .06; transform: rotate(-15deg); }
    .lead-hero .big-avatar { width: 64px; height: 64px; border-radius: 18px; background: var(--pf-gradient); color: #141414; font-size: 1.6rem; font-weight: 800; display: grid; place-items: center; text-transform: uppercase; flex-shrink: 0; }
    .lead-hero h3 { font-weight: 800; margin: 0; font-size: 1.5rem; color: #fff; }
    .lead-hero .meta { color: rgba(255,255,255,.6); font-size: .82rem; }
    .lead-hero .hero-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .lead-hero .hbtn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 10px; font-weight: 700; font-size: .8rem; border: 1px solid rgba(255,215,0,.35); color: var(--pf-gold); background: transparent; }
    .lead-hero .hbtn:hover { background: rgba(255,215,0,.1); color: var(--pf-gold); }
    .lead-hero .hbtn.gold { background: var(--pf-gradient); color: #141414; border: 0; }
    .lead-hero .hbtn.gold:hover { filter: brightness(1.05); }
    .mini-stat { background: var(--pf-surface); border: 1px solid var(--pf-border); border-radius: var(--pf-radius); padding: 14px 16px; height: 100%; box-shadow: var(--pf-shadow-sm); }
    .mini-stat .k { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--pf-text-2); }
    .mini-stat .v { font-size: 1.1rem; font-weight: 800; color: var(--pf-text); margin-top: 2px; }
    .info-list { list-style: none; padding: 0; margin: 0; }
    .info-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--pf-border); font-size: .875rem; }
    .info-list li:last-child { border-bottom: 0; }
    .info-list .k { color: var(--pf-text-2); display: flex; align-items: center; gap: 8px; }
    .info-list .k i { color: var(--pf-accent-text); }
    .info-list .v { font-weight: 600; color: var(--pf-text); text-align: right; word-break: break-word; }
    .info-list .v a { color: var(--pf-text); }
    .info-list .v a:hover { color: var(--pf-accent-text); }
    .htl { list-style: none; padding: 0; margin: 0; position: relative; }
    .htl > li { position: relative; padding-left: 46px; padding-bottom: 20px; }
    .htl > li:last-child { padding-bottom: 0; }
    .htl > li::before { content: ''; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--pf-border); }
    .htl > li:last-child::before { display: none; }
    .htl .dot { position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--pf-gold-soft); color: var(--pf-accent-text); display: grid; place-items: center; font-size: .875rem; border: 1px solid var(--pf-gold-border); }
    .htl .dot.converted { background: var(--pf-gradient); color: #141414; border: 0; }
    .htl .dot.bad { background: var(--pf-danger-soft); color: var(--pf-danger); border: 0; }
    .htl .dot.good { background: var(--pf-success-soft); color: var(--pf-success); border: 0; }
    .htl .note { background: var(--pf-surface-2); border: 1px solid var(--pf-border); border-radius: 10px; padding: 10px 14px; font-size: .875rem; color: var(--pf-text); margin-top: 8px; white-space: pre-line; }
    .converted-banner { background: var(--pf-gradient); color: #141414; border-radius: var(--pf-radius); padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-weight: 600; }
    .converted-banner a { color: #141414; font-weight: 800; text-decoration: underline; }
</style>
