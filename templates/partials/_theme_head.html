{% load static %}
<meta name="theme-color" content="#F5F5F2">
<meta name="color-scheme" content="light dark">
<script>
    /* Apply saved theme (default light) before first paint (prevents flash) */
    (function () {
        var t = null;
        try { t = localStorage.getItem('pf-theme'); } catch (e) {}
        if (t !== 'dark') t = 'light'; /* default theme is light */
        document.documentElement.setAttribute('data-bs-theme', t);
        try { if (localStorage.getItem('pf-sidebar-mini') === '1') document.documentElement.classList.add('pf-mini'); } catch (e) {}
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{% static 'css/profit-theme.css' %}?v={{ theme_version }}">
